name: ie-bank-backend

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  BACKEND_WEBAPP_DEV: aguadamillas-be-dev
  BACKEND_WEBAPP_UAT: aguadamillas-be-uat
  BACKEND_WEBAPP_PROD: aguadamillas-be-prod

jobs:
  test:
    name: 🧪 Test & Quality Checks
    runs-on: ubuntu-latest
    env:
      ENV: ghci

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 📦 Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: ⬆️ Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: 📋 Install dependencies
      run: |
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov bandit safety

    - name: 🔍 Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 🔒 Security scan with bandit
      run: |
        bandit -r iebank_api/ -f json -o bandit-report.json || true
        bandit -r iebank_api/ || true

    - name: 🛡️ Check dependencies for vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check || true

    - name: 🧪 Run unit tests
      run: |
        python -m pytest tests/unit/ -v --cov=iebank_api --cov-report=xml --cov-report=term-missing

    - name: 🔗 Run functional tests
      run: |
        python -m pytest tests/functional/ -v --cov=iebank_api --cov-append --cov-report=xml --cov-report=term-missing

    - name: 🌐 Run integration tests
      run: |
        python -m pytest tests/ -v --cov=iebank_api --cov-report=xml --cov-report=term-missing --cov-report=html

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

    - name: 📈 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          coverage.xml
          htmlcov/
          bandit-report.json
          safety-report.json

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: test
    env:
      ENV: ghci

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 📦 Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: ⬆️ Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: 📋 Install dependencies
      run: |
        pip install -r requirements.txt

    - name: 🔧 Create deployment package
      run: |
        # Remove development dependencies and test files
        rm -rf tests/
        rm -rf .pytest_cache/
        rm -rf htmlcov/
        rm -f .coverage
        rm -f coverage.xml
        # Create a clean requirements.txt for production
        pip freeze > requirements-freeze.txt

    - name: 📤 Upload artifact for deployment jobs
      uses: actions/upload-artifact@v4
      with:
        name: python-app
        path: |
          .
          !.git
          !.github
          !tests
          !.pytest_cache
          !htmlcov
          !*.pyc
          !__pycache__

  deploy-dev:
    name: 🚀 Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: 📥 Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: python-app
        path: .

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      id: deploy-to-webapp
      with:
        app-name: ${{ env.BACKEND_WEBAPP_DEV }}
        package: .

    - name: ✅ Health Check
      run: |
        sleep 30
        curl -f https://${{ env.BACKEND_WEBAPP_DEV }}.azurewebsites.net/skull || exit 1

  deploy-uat:
    name: 🎭 Deploy to UAT
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: github.ref == 'refs/heads/main'
    environment:
      name: 'UAT'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: 📥 Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: python-app
        path: .

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      id: deploy-to-webapp
      with:
        app-name: ${{ env.BACKEND_WEBAPP_UAT }}
        package: .

    - name: ✅ Health Check
      run: |
        sleep 30
        curl -f https://${{ env.BACKEND_WEBAPP_UAT }}.azurewebsites.net/skull || exit 1

  deploy-prod:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-uat]
    if: github.ref == 'refs/heads/main'
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: 📥 Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: python-app
        path: .

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      id: deploy-to-webapp
      with:
        app-name: ${{ env.BACKEND_WEBAPP_PROD }}
        package: .

    - name: ✅ Health Check
      run: |
        sleep 30
        curl -f https://${{ env.BACKEND_WEBAPP_PROD }}.azurewebsites.net/skull || exit 1

    - name: 🏷️ Create Release Tag
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "v$(date +'%Y.%m.%d')-${{ github.run_number }}" -m "Production release $(date +'%Y.%m.%d')-${{ github.run_number }}"
        git push origin "v$(date +'%Y.%m.%d')-${{ github.run_number }}"
    