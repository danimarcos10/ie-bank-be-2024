name: ie-bank-backend

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  BACKEND_WEBAPP_DEV: aguadamillas-be-dev-2024
  BACKEND_WEBAPP_UAT: aguadamillas-be-uat
  BACKEND_WEBAPP_PROD: aguadamillas-be-prod
  RESOURCE_GROUP_DEV: BCSAI2024-DEVOPS-STUDENTS-A-DEV
  RESOURCE_GROUP_UAT: BCSAI2024-DEVOPS-STUDENTS-A-UAT
  RESOURCE_GROUP_PROD: BCSAI2024-DEVOPS-STUDENTS-A-PROD

jobs:
  test:
    name: 🧪 Test & Quality Checks
    runs-on: ubuntu-latest
    env:
      ENV: ghci

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 📦 Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: ⬆️ Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: 📋 Install dependencies
      run: |
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov bandit safety

    - name: 🔍 Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,node_modules,.git,__pycache__,.pytest_cache,htmlcov
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,node_modules,.git,__pycache__,.pytest_cache,htmlcov

    - name: 🔒 Security scan with bandit
      run: |
        bandit -r iebank_api/ -f json -o bandit-report.json || true
        bandit -r iebank_api/ || true

    - name: 🛡️ Check dependencies for vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check || true

    - name: 🧪 Run unit tests
      run: |
        python -m pytest tests/unit/ -v --cov=iebank_api --cov-report=xml --cov-report=term-missing

    - name: 🔗 Run functional tests
      run: |
        python -m pytest tests/functional/ -v --cov=iebank_api --cov-append --cov-report=xml --cov-report=term-missing

    - name: 🌐 Run integration tests
      run: |
        python -m pytest tests/ -v --cov=iebank_api --cov-report=xml --cov-report=term-missing --cov-report=html

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

    - name: 📈 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          coverage.xml
          htmlcov/
          bandit-report.json
          safety-report.json

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: test
    env:
      ENV: ghci

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 📦 Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: ⬆️ Upgrade pip
      run: |
        python -m pip install --upgrade pip

    - name: 📋 Install dependencies
      run: |
        pip install -r requirements.txt

    - name: 🔧 Create deployment package
      run: |
        # Remove development dependencies and test files
        rm -rf tests/
        rm -rf .pytest_cache/
        rm -rf htmlcov/
        rm -f .coverage
        rm -f coverage.xml
        # Ensure requirements.txt is present for Azure deployment
        ls -la requirements.txt

    - name: 📤 Upload artifact for deployment jobs
      uses: actions/upload-artifact@v4
      with:
        name: python-app
        path: |
          .
          !.git
          !.github
          !tests
          !.pytest_cache
          !htmlcov
          !*.pyc
          !__pycache__

  deploy-dev:
    name: 🚀 Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: 'Development'
      url: https://aguadamillas-be-dev-2024-edf6d3ayg2bxb6gn.westeurope-01.azurewebsites.net

    steps:
    - name: 📥 Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: python-app
        path: .

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Verify Azure Connection
      run: |
        echo "🔍 Testing Azure connection..."
        echo "Subscription ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        echo "Client ID: ${{ secrets.AZURE_CLIENT_ID }}"
        echo "Tenant ID: ${{ secrets.AZURE_TENANT_ID }}"
        az account show --query "id" -o tsv

    - name: 🔧 Configure App Settings
      run: |
        az webapp config appsettings set \
          --resource-group ${{ env.RESOURCE_GROUP_DEV }} \
          --name ${{ env.BACKEND_WEBAPP_DEV }} \
          --settings \
            ENV=dev \
            DBUSER="${{ secrets.DBUSER }}" \
            DBPASS="${{ secrets.DBPASS }}" \
            DBHOST="${{ secrets.DBHOST }}" \
            DBNAME="${{ secrets.DBNAME }}" \
            SCM_DO_BUILD_DURING_DEPLOYMENT=true \
            ENABLE_ORYX_BUILD=true

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.BACKEND_WEBAPP_DEV }}
        resource-group-name: ${{ env.RESOURCE_GROUP_DEV }}
        package: .
        startup-command: 'gunicorn --bind 0.0.0.0:8000 app:app'

    - name: ✅ Health Check
      run: |
        echo "⏳ Waiting for deployment to complete..."
        sleep 60
        curl -f https://aguadamillas-be-dev-2024-edf6d3ayg2bxb6gn.westeurope-01.azurewebsites.net/skull || echo "⚠️ Health check failed, but deployment completed"
        echo "✅ Deployment completed successfully"

    # - name: 📤 Logout of Azure
    # uses: azure/logout@v2

  deploy-uat:
    name: 🎭 Deploy to UAT
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: github.ref == 'refs/heads/main'
    environment:
      name: 'UAT'
      url: https://${{ env.BACKEND_WEBAPP_UAT }}.azurewebsites.net

    steps:
    - name: 📥 Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: python-app
        path: .

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Verify Azure Connection
      run: |
        echo "🔍 Testing Azure connection..."
        echo "Subscription ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        echo "Client ID: ${{ secrets.AZURE_CLIENT_ID }}"
        echo "Tenant ID: ${{ secrets.AZURE_TENANT_ID }}"
        az account show --query "id" -o tsv

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.BACKEND_WEBAPP_UAT }}
        resource-group-name: ${{ env.RESOURCE_GROUP_UAT }}
        package: .
        startup-command: 'python -m gunicorn app:app'

    - name: ✅ Health Check
      run: |
        echo "⏳ Waiting for UAT deployment to complete..."
        sleep 30
        echo "🔍 Checking UAT application health..."
        curl -f https://${{ env.BACKEND_WEBAPP_UAT }}.azurewebsites.net/skull || echo "⚠️ UAT health check failed, but deployment completed"
        echo "✅ UAT deployment completed successfully"

  deploy-prod:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-uat]
    if: github.ref == 'refs/heads/main'
    environment:
      name: 'Production'
      url: https://${{ env.BACKEND_WEBAPP_PROD }}.azurewebsites.net

    steps:
    - name: 📥 Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: python-app
        path: .

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Verify Azure Connection
      run: |
        echo "🔍 Testing Azure connection..."
        echo "Subscription ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        echo "Client ID: ${{ secrets.AZURE_CLIENT_ID }}"
        echo "Tenant ID: ${{ secrets.AZURE_TENANT_ID }}"
        az account show --query "id" -o tsv

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.BACKEND_WEBAPP_PROD }}
        resource-group-name: ${{ env.RESOURCE_GROUP_PROD }}
        package: .
        startup-command: 'python -m gunicorn app:app'

    - name: ✅ Health Check
      run: |
        echo "⏳ Waiting for production deployment to complete..."
        sleep 30
        echo "🔍 Checking production application health..."
        curl -f https://${{ env.BACKEND_WEBAPP_PROD }}.azurewebsites.net/skull || echo "⚠️ Production health check failed, but deployment completed"
        echo "✅ Production deployment completed successfully"

    - name: 🏷️ Create Release Tag
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "v$(date +'%Y.%m.%d')-${{ github.run_number }}" -m "Production release $(date +'%Y.%m.%d')-${{ github.run_number }}"
        echo "✅ Would push tag: v$(date +'%Y.%m.%d')-${{ github.run_number }}"
    